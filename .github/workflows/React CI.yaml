name: Continuous Integration
on:
  push:
    branches: [Main, Development]
  workflow_dispatch:
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v6
      - name: Setup Node.JS environment
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm clean-install
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: install
    steps:
      - name: Build
        run: npm run build
